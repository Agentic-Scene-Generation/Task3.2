# SceneExpert MVP configuration
# Loaded via Hydra defaults as: scene_expert: base_scene_expert
#
# Override in ablation experiment YAMLs:
#   scene_expert.enabled: false   → disable SceneExpert entirely
#   scene_expert.mode: "harness_only" | "harness_memory" | "full" | "disabled"

# Master switch
enabled: false   # Default: off. Set true in ablation_3/4/5 experiment configs.

# Ablation mode controls which components are active:
#   "disabled"       → no-op; hooks are never built
#   "harness_only"   → TaskCompiler + Harness + GlobalPlanner; no memory/capture
#   "harness_memory" → Harness + FastMemory; no offline trajectory capture
#   "full"           → harness_memory + observer-only Slow Memory capture
mode: "disabled"

# Per-stage asset policy. Every native SceneSmith stage still executes.
#   auto          → prompt-explicit assets are required minimums; planner and
#                   native designer may add capacity-aware same-stage assets.
#   required_only → strict ablation with no optional asset recommendations.
# An empty required inventory never becomes a no-op or a skipped stage.
stage_policy:
  default: "${oc.env:SCENEEXPERT_STAGE_POLICY_DEFAULT,auto}"
  floor_plan: "${oc.env:SCENEEXPERT_STAGE_POLICY_FLOOR_PLAN,''}"
  furniture: "${oc.env:SCENEEXPERT_STAGE_POLICY_FURNITURE,''}"
  wall_mounted: "${oc.env:SCENEEXPERT_STAGE_POLICY_WALL_MOUNTED,''}"
  ceiling_mounted: "${oc.env:SCENEEXPERT_STAGE_POLICY_CEILING_MOUNTED,''}"
  manipuland: "${oc.env:SCENEEXPERT_STAGE_POLICY_MANIPULAND,''}"

# Strict paired-evaluation contract. Leave these fields empty/false for normal
# generation. The canonical Full Memory pair launcher sets all four fields and
# the factory then opens the existing memory bank read-only.
evaluation:
  pair_id: "${oc.env:SCENEEXPERT_EVAL_PAIR_ID,''}"
  controlled_dimension: "${oc.env:SCENEEXPERT_EVAL_DIMENSION,''}"
  arm: "${oc.env:SCENEEXPERT_EVAL_ARM,''}"
  require_frozen_memory: ${oc.env:SCENEEXPERT_EVAL_REQUIRE_FROZEN_MEMORY,false}

# Independent component gates. ``null`` inherits the legacy mode preset; an
# explicit true/false overrides it. This preserves existing experiment names
# while allowing strict single-variable ablations.
components:
  task_compiler:
    enabled: null
  harness:
    enabled: null
  # Limits only SceneExpert's outer planning/repair loop. It never overrides
  # SceneSmith designer or critic iteration counts.
  harness_budget:
    enabled: null
  global_planner:
    enabled: null
  prompt_injection:
    enabled: null
  fast_memory_retrieval:
    enabled: null
  memory_writer:
    enabled: null
  stage_working_memory:
    enabled: null
  verifier:
    enabled: null
  repair:
    enabled: null
  # Consume the authoritative SceneBenchmark critic result; never start a
  # second critic loop.
  critic_bridge:
    enabled: null
    source: "scenebenchmark_critic"
  trace:
    enabled: null
  # Bounded JSON-schema transport for TaskCompiler, GlobalPlanner, and
  # MemoryWriter. A failed writer call is auditable and performs no write.
  structured_llm:
    enabled: false
  # Observer-only capture of designer/repair trajectories for offline DPO.
  # The full preset enables it; harness_only/harness_memory keep it off unless
  # an explicit component override requests a dedicated capture experiment.
  # It never changes main's stage decisions or starts a training job.
  slow_memory_capture:
    enabled: null

# Slow memory is an offline consumer of authoritative main artifacts. Runtime
# capture is append-only and separately gated; dataset export and training are
# explicit scripts, never automatic ACP side effects.
slow_memory:
  capture:
    max_prompt_chars: ${oc.env:SCENEEXPERT_SLOW_MEMORY_MAX_PROMPT_CHARS,131072}
    # Canonical tool trajectories can be long even after images are externalized.
    # One MiB prevents loss while keeping duplicate raw SDK payloads out of rows.
    max_response_chars: ${oc.env:SCENEEXPERT_SLOW_MEMORY_MAX_RESPONSE_CHARS,1048576}

# Direct structured calls made by SceneExpert itself. These roles share one
# local OpenAI-compatible client, but each role has an explicit bounded budget.
structured_llm:
  roles:
    task_compiler:
      thinking_mode: "none"
      max_tokens: 768
      retry_max_tokens: 1536
      timeout_seconds: 45
      temperature: 0.1
      max_attempts: 2
      response_format: "json_schema"
    global_planner:
      thinking_mode: "none"
      max_tokens: 1024
      retry_max_tokens: 2048
      timeout_seconds: 60
      temperature: 0.1
      max_attempts: 2
      response_format: "json_schema"
    memory_writer:
      # Memory extraction is bounded schema transcription, not open-ended
      # reasoning. Disabling hidden thinking preserves output tokens for the
      # required JSON and avoids reasoning-only/length failures.
      thinking_mode: "none"
      max_tokens: ${oc.env:SCENEEXPERT_MEMORY_WRITER_MAX_TOKENS,2048}
      retry_max_tokens: ${oc.env:SCENEEXPERT_MEMORY_WRITER_RETRY_MAX_TOKENS,4096}
      timeout_seconds: 90
      temperature: 0.1
      max_attempts: 2
      response_format: "json_schema"

# Optional deterministic AgentSense-style resident behavior planner. This is
# intentionally separate from the SceneExpert ablation mode and is a strict
# no-op unless enabled explicitly.
behavior:
  enabled: false
  planner: "template"
  horizon: "week"
  # When false, the full behavior report is still written for audit, but only
  # assets explicitly found in the prompt are merged into SceneTaskSpec.
  inferred_assets_are_required: true

# Deterministic capacity/opening gate for future furniture and wall stages.
# Kept off in the compatible base config; ablation 3 enables it explicitly.
floor_plan_reservations:
  enabled: false
  # Exact user geometry (dimensions or polygon vertices) wins over inferred
  # functional-zone area. Door/window and wall-capacity checks stay hard.
  explicit_geometry_policy:
    enabled: true
    functional_zone_area: advisory
    verify_geometry_match: true
    absolute_area_tolerance_m2: 0.10
    relative_area_tolerance: 0.01
    vertex_tolerance_m: 0.01

# Memory system
memory:
  # Directory for persistent memory storage (relative to project root)
  dir: "${paths.memory_dir}"
  retriever_type: "${oc.env:SCENEEXPERT_MEMORY_RETRIEVER_TYPE,lexical}"
  retrieval:
    max_success_cases: 3
    max_failure_cases: 3
    max_skills: 2
    recall_top_k: ${oc.env:SCENEEXPERT_MEMORY_RECALL_TOP_K,30}
    sim_threshold: ${oc.env:SCENEEXPERT_MEMORY_SIM_THRESHOLD,0.0}
    object_overlap_threshold: ${oc.env:SCENEEXPERT_MEMORY_OBJECT_OVERLAP_THRESHOLD,0.15}
    # Prevent an identical prompt from retrieving its own earlier output. This
    # makes 4c evidence genuinely cross-task rather than replay leakage.
    exclude_same_task: ${oc.env:SCENEEXPERT_MEMORY_EXCLUDE_SAME_TASK,true}
  writer:
    # Success memory requires both final/stage pass evidence and this score.
    success_min_overall_score: ${oc.env:SCENEEXPERT_MEMORY_SUCCESS_MIN_SCORE,0.75}
    # Stage-local Skill candidates remain non-retrievable until this many
    # distinct prompt/task identities provide compatible positive evidence.
    skill_min_independent_support: ${oc.env:SCENEEXPERT_SKILL_MIN_INDEPENDENT_SUPPORT,2}
  embedding:
    model_id: "${oc.env:SCENEEXPERT_MEMORY_EMBEDDING_MODEL_ID,BAAI/bge-m3}"
    # Actual local loading path. Keep BGE-M3 directly under models_dir/bge-m3.
    model_dir: "${oc.env:SCENEEXPERT_MEMORY_EMBEDDING_MODEL_DIR,${paths.models_dir}/bge-m3}"
    # Online retrieval should default to CPU to avoid competing with vLLM/OpenCLIP.
    device: "${oc.env:SCENEEXPERT_MEMORY_EMBEDDING_DEVICE,cpu}"
    # Offline index builds may override this to cuda.
    index_device: "${oc.env:SCENEEXPERT_MEMORY_EMBEDDING_INDEX_DEVICE,cpu}"
    batch_size: ${oc.env:SCENEEXPERT_MEMORY_EMBEDDING_BATCH_SIZE,8}
    max_length: ${oc.env:SCENEEXPERT_MEMORY_EMBEDDING_MAX_LENGTH,512}
    normalize: true
  index:
    backend: "${oc.env:SCENEEXPERT_MEMORY_INDEX_BACKEND,numpy}"
    # Empty means <memory.dir>/indexes. Set env only for a custom shared index dir.
    dir: "${oc.env:SCENEEXPERT_MEMORY_INDEX_DIR,''}"
    require_ready: ${oc.env:SCENEEXPERT_MEMORY_INDEX_REQUIRE_READY,true}
    # If true, hybrid/vector memory builds missing numpy indexes in-process
    # before retrieval starts. This keeps ACP runs robust when JSONL memory
    # grows between experiments.
    auto_build_missing: ${oc.env:SCENEEXPERT_MEMORY_INDEX_AUTO_BUILD_MISSING,false}
  hybrid_weights:
    embedding_similarity: 0.45
    object_overlap: 0.20
    room_stage_match: 0.15
    memory_quality_score: 0.10
    recency_or_verified: 0.10

# Per-stage execution budget
stage_budget:
  # Default budget applies to all stages not explicitly listed below
  default:
    max_designer_iterations: 2
    max_repair_steps: 1
  # Manipuland is the most error-prone stage — allow more repair attempts
  manipuland:
    max_designer_iterations: 2
    max_repair_steps: 2

# Verifier pass thresholds
verifier:
  # Minimum average score (0-1) to consider a stage passing
  stage_pass_threshold: 0.6
  # Minimum overall score (0-1) to consider the full scene passing
  full_pass_threshold: 0.7
  # scores.yaml is VLM/LLM feedback. Keep it as an audit/ranking signal; only
  # deterministic scene facts may block normal generation or create failures.
  # Enable this only for a controlled offline visual-quality ablation.
  visual_score_hard_gate: false
