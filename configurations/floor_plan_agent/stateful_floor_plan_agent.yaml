# Stateful floor plan agent configuration with planner/designer/critic trio

defaults:
  - base_floor_plan_agent

# Agent configurations
agents:
  planner_agent:
    name: "floor_plan_planner"
    max_turns: 60
    prompt: PLANNER_AGENT

  designer_agent:
    name: "floor_plan_designer"
    # A valid plan is normally complete after one bounded edit pass.  This
    # prevents a designer from endlessly revisiting windows after the required
    # room geometry and wall reservations are already valid.
    max_turns: 32
    prompt: DESIGNER_AGENT

  critic_agent:
    name: "floor_plan_critic"
    max_turns: 12
    prompt: CRITIC_AGENT
