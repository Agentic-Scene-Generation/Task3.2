# Ablation 5: the validated 4c runtime plus observer-only Slow Memory capture.
#
# Scene generation intentionally inherits every 4c setting: Main critic and
# deterministic repair ownership, degraded completion policy, structured LLM
# transport, Hybrid Fast Memory, thresholds, and stage budgets. The sole mode
# delta is replayable trajectory capture for later offline DPO curation.
#
# This experiment never starts training and never selects a model checkpoint.
# Serve either the base or a trained candidate separately, then set
# SCENEEXPERT_MODEL_ID to that server's exact alias.
#
# Usage:
#   SCENEEXPERT_MODEL_ID="unsloth/Qwen3.8-27B-GGUF" \
#     python main.py experiment=ablation_5_qwen3_full

defaults:
  - ablation_4c_qwen3_hybrid_memory
  - _self_

scene_expert:
  mode: "full"
  components:
    slow_memory_capture:
      enabled: true
