# Ablation 5: Qwen3 + Expert Harness + Fast Memory + Slow LoRA  (Full SceneExpert)
# Complete system: online closed-loop + Qwen3 LoRA specialization (offline pre-trained).
# LoRA checkpoint must be available at the path specified in agent configs.
#
# Component status:
#   TaskCompiler:    ON
#   Harness FSM:     ON
#   Global Planner:  ON  (using LoRA-specialized Qwen3)
#   Fast Memory:     ON
#   Repair loop:     ON
#   Trace logger:    ON
#   Memory writer:   ON
#   DPO capture:      ON  (observer-only, independently switchable)
#   Slow LoRA:       ON  (SCENEEXPERT_FULL_MODEL_ID selects the served model)
#
# Prerequisites:
#   1. Run offline SFT/DPO training on traces from ablation_4.
#   2. Start a vLLM server with the LoRA-merged model.
#   3. Set OPENAI_BASE_URL to the LoRA model endpoint.
#   4. Export SCENEEXPERT_FULL_MODEL_ID to that server's exact model alias.
#
# Usage:
#   SCENEEXPERT_FULL_MODEL_ID="Qwen/SceneExpert-DPO" \
#     python main.py experiment=ablation_5_qwen3_full

defaults:
  - base_experiment

scene_expert:
  enabled: true
  mode: "full"   # harness + memory + LoRA (same as harness_memory at runtime; model is the difference)
  slow_memory:
    # This alias must exactly match the model name exposed by the inference
    # server. If unset, the normal SCENEEXPERT_MODEL_ID remains in use.
    served_model_id: ${oc.env:SCENEEXPERT_FULL_MODEL_ID,${oc.env:SCENEEXPERT_MODEL_ID,Qwen/Qwen3.5-35B-A3B}}
  memory:
    dir: "${paths.memory_dir}/ablation_5"
    retrieval:
      max_success_cases: 3
      max_failure_cases: 3
      max_skills: 2
  stage_budget:
    default:
      max_designer_iterations: 2
      max_repair_steps: 1
    manipuland:
      max_designer_iterations: 2
      max_repair_steps: 2
  verifier:
    stage_pass_threshold: 0.6
    full_pass_threshold: 0.7
