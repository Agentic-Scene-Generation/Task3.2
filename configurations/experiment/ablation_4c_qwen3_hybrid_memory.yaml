# Ablation 4c: Qwen3 + Expert Harness + Hybrid Memory
# Uses BGE-M3 numpy recall plus structured filter and hybrid score.
#
# Optional pre-build step for cleaner timing logs. Missing indexes are also
# auto-built at startup because index.auto_build_missing=true below.
#   python scripts/build_memory_index.py \
#     --memory-dir "$SCENEEXPERT_MEMORY_DIR/ablation_4c" \
#     --embedding-model-dir "$SCENEEXPERT_MEMORY_EMBEDDING_MODEL_DIR"
#
# Usage:
#   python main.py experiment=ablation_4c_qwen3_hybrid_memory

defaults:
  - base_experiment

# SceneBenchmark critic is the authoritative deterministic evidence provider
# for 4c. Keep prompt-originated contracts in shadow mode until a separate
# replay authorizes contract-mode hard gating.
scenebenchmark_critic:
  enabled: ${oc.env:SCENEEXPERT_SCENEBENCHMARK_CRITIC_ENABLED,true}
  inject_into_llm_critic: true
  agent_prompt_context_filter_enabled: true
  fd_relation_proposer_mode: template
  max_fd_relation_proposals: 8
  constraint_mode: ${oc.env:SCENEEXPERT_CRITIC_CONSTRAINT_MODE,shadow}
  hard_gate: ${oc.env:SCENEEXPERT_CRITIC_PROVIDER_HARD_GATE,false}
  intent_compiler:
    enabled: true
  visual_grounding:
    enabled: false
  vlm_hard_gate: false

scene_expert:
  enabled: true
  mode: "harness_memory"
  critic_integration:
    enabled: ${oc.env:SCENEEXPERT_CRITIC_INTEGRATION_ENABLED,true}
    memory_enabled: ${oc.env:SCENEEXPERT_CRITIC_MEMORY_ENABLED,true}
    persist_raw_reports: true
    require_schema_version: true
    require_available: ${oc.env:SCENEEXPERT_CRITIC_REQUIRE_AVAILABLE,true}
    stage_gate_enabled: ${oc.env:SCENEEXPERT_CRITIC_STAGE_GATE_ENABLED,false}
  memory:
    dir: "${paths.memory_dir}/ablation_4c"
    retriever_type: "hybrid"
    retrieval:
      max_success_cases: 3
      max_failure_cases: 3
      max_skills: 2
      recall_top_k: 30
      sim_threshold: 0.0
      object_overlap_threshold: 0.15
    index:
      backend: "numpy"
      dir: ""
      require_ready: true
      auto_build_missing: true
    hybrid_weights:
      embedding_similarity: 0.45
      object_overlap: 0.20
      room_stage_match: 0.15
      memory_quality_score: 0.10
      recency_or_verified: 0.10
  stage_budget:
    default:
      max_designer_iterations: 2
      max_repair_steps: 1
    manipuland:
      max_designer_iterations: 2
      max_repair_steps: 2
  verifier:
    stage_pass_threshold: 0.6
    full_pass_threshold: 0.7
