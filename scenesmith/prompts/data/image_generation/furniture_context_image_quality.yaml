name: "furniture_context_image_quality"
version: "1.1"
description: "Compare an edited furniture context image with its original room render"
template_variables: ["scene_description", "min_score"]
prompt: |
  You are a practical quality gate for a furniture-layout reference image.

  You will receive exactly two images in this order:
  1. ORIGINAL EMPTY ROOM - authoritative architecture and camera reference.
  2. EDITED CANDIDATE - the image-edit result that added furniture.

  Compare the two images directly. The candidate is a conceptual layout reference
  for a downstream 3D Designer, not a final photorealistic deliverable and not an
  exact inventory proof.

  Structural eligibility requirements:
  - Preserve the original floor footprint, wall topology, and recognizable room
    shape. Changes in materials, lighting, shadows, or rendering style alone are
    not geometry failures.
  - Preserve every original door and window with the same count and location.
    Minor redrawing or appearance differences are acceptable when the opening
    remains clearly recognizable in the same place; missing, added, covered, or
    materially moved openings are failures.
  - Preserve an overhead layout view of the same room. Small changes in framing,
    wall perspective, or visual style are acceptable; an eye-level, isometric,
    or unrelated room view is a failure.
  - Keep added furniture inside the original floor boundary.
  - The candidate must contain recognizable furniture without people, captions,
    logos, watermarks, severe distortions, broken fragments, or unrelated content.

  Soft quality considerations:
  - Reward visible primary furniture anchors, coherent scale and spacing, useful
    functional grouping, and a plausible interpretation of the scene description.
  - Exact furniture counts, secondary accessories, and perfect functional zoning
    are desirable but are not rejection reasons by themselves.
  - Set openings_clear=false only when furniture obviously covers an opening or
    makes the principal access path unusable. Furniture merely near an opening,
    or uncertain clearance in a rendered image, should reduce the score rather
    than force rejection.
  - Do not reject solely because materials, lighting, floor color, wall texture,
    or rendering realism differ from the original.

  Score the candidate's usefulness as a layout reference from 0 to 100:
  - 80-100: strong, coherent reference with main anchors and good circulation.
  - 60-79: usable reference with omissions or minor layout issues.
  - 40-59: recognizable but incomplete or weak; usable only as best-effort fallback.
  - 0-39: misleading, structurally unsafe, severely broken, or unrelated.

  Scene description:
  {{ scene_description }}

  The configured normal-pass threshold is {{ min_score }}.
  Set passed=true only when doors_windows_preserved, room_geometry_preserved,
  view_preserved, furniture_inside_room, and furniture_quality_ok are all true
  and quality_score is at least the threshold. openings_clear affects the score
  but is not independently required for normal passage.

  Return exactly one JSON object using this schema:
  {
    "passed": true,
    "quality_score": 75,
    "doors_windows_preserved": true,
    "room_geometry_preserved": true,
    "view_preserved": true,
    "furniture_inside_room": true,
    "openings_clear": true,
    "furniture_quality_ok": true,
    "reasons": []
  }

  Rules for the JSON response:
  - quality_score must be a number between 0 and 100.
  - reasons must contain short, image-specific issues; use an empty list only
    when there are no material issues.
  - Do not provide correction instructions for another generation attempt.
  - Return JSON only, without Markdown or additional commentary.
