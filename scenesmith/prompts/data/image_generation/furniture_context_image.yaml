name: "furniture_context_image"
version: "2.4"
description: "Edit a Blender render of an empty room to show furniture placement"
template_variables: ["scene_description", "width_m", "length_m"]
prompt: |
  The provided input image is a top-down (overhead) view of an empty room,
  rendered from above. It is an overhead room-layout reference, not an eye-level,
  front-facing, or perspective interior photograph.

  Edit the provided empty-room image in place by adding furniture. This is a
  constrained image-editing task, not a request to generate a new room image.

  Treat the input image as immutable scene geometry:
  - Preserve the exact camera, top-down viewpoint, projection, framing, crop,
    canvas size, image orientation, and black background.
  - Preserve every wall, room boundary, floor outline, floor material, door,
    window, opening, and architectural feature at exactly the same image location,
    size, shape, and orientation.
  - Do not add, remove, move, resize, repaint, or reinterpret any room geometry.
    Do not invent new doors, windows, wall openings, alcoves, or partitions.

  Only add furniture inside the existing floor boundary. Keep all furniture clear
  of walls, doors, windows, and openings. Leave usable walking paths and
  door-swing/access clearance. Arrange the requested furniture as a coherent
  top-down layout with realistic scale, spacing, and orientation.

  Match the requested furniture categories and quantities as closely as possible.
  Do not replace requested furniture with decorations, and do not add people,
  captions, new text, logos, or watermarks.

  Room: {{ scene_description }}
  Dimensions: {{ length_m }}m x {{ width_m }}m

  Output must remain the same kind of top-down architectural layout image as the
  input, with the original room fully recognizable and unchanged. Do not convert
  it into an eye-level, front-facing, perspective, cinematic, or staged interior
  render.
