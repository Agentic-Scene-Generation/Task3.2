name: "furniture_context_image"
version: "5.0"
description: "Edit a Blender render of an empty room to show furniture placement"
template_variables: ["scene_description", "width_m", "length_m"]
prompt: |
  Edit the supplied empty-room Blender render in place by adding the requested
  furniture. Keep exactly the same overhead camera, projection, framing, canvas,
  orientation, black exterior, floor and wall geometry, materials, lighting, and
  all architectural features. Every door, window, opening, and door swing must
  remain visible at its original count, position, size, shape, and orientation;
  do not redraw, cover, move, add, or remove architecture.

  Place the requested furniture at realistic scale and spacing, entirely on the
  existing floor and clear of walls, openings, door swings, polygon cutouts, and
  main walking routes. Preserve requested counts, pairs, groups, and coarse zones
  when they safely fit; omit nonessential items instead of changing the room.
  Apply normal functional relationships: bed headboard on an available solid
  wall away from windows, nightstands beside the headboard, storage against a
  usable wall with its front facing inward, chairs facing their work surface,
  seating facing its focal group, and clear staff space behind service counters.

  Make additions look rendered in the original Blender scene. Do not produce a
  new room, perspective or eye-level view, illustration, cartoon, anime, sketch,
  line art, diagram, text, logo, watermark, or people.

  Furniture request and layout constraints: {{ scene_description }}
  Room dimensions: {{ length_m }}m x {{ width_m }}m.

  Return only the edited image with the original room still exactly recognizable.
