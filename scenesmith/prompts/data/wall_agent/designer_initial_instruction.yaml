name: "designer_initial_instruction"
version: "1.0"
description: "Instructions for initial wall decoration design phase"
template_variables: ["wall_summary", "required_wall_objects"]
prompt: |
  Create the initial wall decoration for this room.

  Required wall prompt items:
  {{ required_wall_objects }}

  REQUIRED-FIRST EXECUTION RULE:
  - If the list above contains a REQUIRED item, generate, place, align, and verify
    every REQUIRED wall object before optional decoration. REQUIRED is a hard
    minimum, not an exhaustive inventory. Do not return merely because the
    required items are complete.
  - If the required placement intersects a window, call list_windows before any
    fallback placement. Resize the exact window first (prefer width 0.6m), then move
    it, and remove it only if necessary. Retry the required object at the support
    centerline and call align_wall_object_over_support. Never shift a required TV
    sideways merely to avoid the window.
  - Under stage_policy=auto, continue with the full decorative workflow after the
    required items are safe. Select optional objects from room type, style, usable
    wall area, openings, and existing furniture; optional objects must not displace
    or obstruct required objects.
  - Under stage_policy=required_only, do not add optional objects, but still run
    the stage, observe the walls, verify the required inventory, and return a
    complete stage result.
  - An empty REQUIRED list never means this stage is skipped. Under auto, perform
    the full decorative workflow below using design judgment.

  Call observe_scene to see all walls with their coordinate grids and excluded regions,
  then design and place appropriate wall-mounted objects.

  ## Wall Surfaces Available:
  {{ wall_summary }}

  ## Initial Design Workflow:

  1. Call observe_scene to see all walls and understand the space
  2. Call get_current_scene_state to get wall dimensions and excluded regions
  3. Identify the primary focal wall (usually opposite entrance or largest wall)
  4. Satisfy every REQUIRED wall prompt item before optional decoration.
  5. Plan decoration for each wall considering:
     - Wall dimensions and available space
     - Excluded regions (doors/windows) to avoid
     - Nearby furniture that affects decoration choices
     - Cross-wall balance and visual harmony
  6. Create TODO list based on your decoration plan
  7. Generate wall decoration assets (batch for style consistency)
  7. Place items using wall-local coordinates from the grid overlays
  8. Save object_ids from placement responses for future operations
  9. Complete TODOs systematically using designer_todo_manager
  10. Call check_physics after placing objects to detect collisions with furniture
  11. Verify decoration with observe_scene - check all walls
  12. FINAL VERIFICATION: Before completing, confirm zero collisions exist. You MUST NOT
      finish while ANY collisions remain - move or remove wall objects that collide with
      furniture below.

  ## Return Format:

  Provide a structured summary including:
  - Wall-mounted objects placed with their wall IDs and coordinates
  - Design rationale for your choices
  - How you used the visual information and coordinate grids
  - Why your decoration creates visual harmony across all walls
