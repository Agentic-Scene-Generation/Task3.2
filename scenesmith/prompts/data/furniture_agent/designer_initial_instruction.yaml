name: "designer_initial_instruction"
version: "1.2"
description: "Instructions for initial furniture design phase"
template_variables:
  - "scene_description"
  - "has_reference_image"
  - "room_length"
  - "room_width"
  - "room_local_footprint_vertices"
prompt: |
  Create the initial furniture layout for this room.

  {% if has_reference_image %}
  IMPORTANT: The reference image above is an AI-edited concept image, NOT a render
  of the current 3D scene. Furniture visible in that image does not exist in the
  scene. The concept image may also change the camera perspective or distort room
  geometry, so never infer exact coordinates, dimensions, doors, windows, walls, or
  current scene contents from it.

  Use the concept image as the preferred reference for furniture selection and
  placement. Reproduce its visible layout as closely as the actual room permits,
  including furniture categories, functional zones, relative positions, facing
  directions, groupings, spacing patterns, and ordering along walls. Preserve the
  image's main anchor objects and layout topology instead of independently
  redesigning the room.

  Call observe_scene to inspect the ACTUAL empty room. Treat observe_scene plus the
  structured scene state as authoritative for room geometry, coordinates, doors,
  windows, and existing scene contents, while treating the concept image as the
  preferred target for furniture arrangement.

  Depart from the reference arrangement only when an appropriate asset cannot be
  retrieved or generated, or when the referenced placement cannot be made valid
  after reasonable attempts to resolve polygon containment, door/window clearance,
  collisions, or required accessibility. When a departure is necessary, make the
  smallest local change possible: first try the closest suitable asset substitute,
  then adjust only the affected object's position, yaw, or spacing while preserving
  its functional zone, neighbors, grouping, and facing relationship. Do not use one
  local conflict as a reason to broadly redesign unaffected parts of the layout.

  If the scene requirements contain furniture that is absent from the concept
  image, add it in the least disruptive valid location without moving image-matched
  anchors unnecessarily. The explicit scene requirements remain authoritative for
  required inventory and constraints.

  You MUST generate and place every required furniture item with the provided tools,
  even when it is already visible in the concept image. Do not claim that an item
  was placed unless its tool call succeeded. Never call finish_stage based on the
  concept image alone.
  {% else %}
  Call observe_scene to see the empty room, then design and place appropriate furniture.
  {% endif %}

  ## Initial Design Workflow:
  {% if has_reference_image %}1. Call observe_scene to inspect the ACTUAL empty room and its authoritative geometry
  2. Extract the concept image's furniture groups, anchor objects, relative positions, facing directions, and zone assignments
  3. Map that reference arrangement onto the authoritative room geometry and preserve it as closely as possible; use minimal local adjustments only for unavailable assets or unresolved validity conflicts
  4. Create a TODO list for every required item and complete it through successful tool calls
  {% else %}1. Call observe_scene to see the empty room and understand the space
  2. Create TODO list based on room requirements
  {% endif %}
  **NEW STEP - Room Completeness Check:**
  5. Identify room type from the scene description (e.g., "minimalist living room")
  6. Consider standard furniture categories for that room type:
     - What does the prompt explicitly require?
     - What additional categories would make this room feel complete?
     - For open-ended prompts: plan to add furniture beyond explicit mentions
     - For minimalist/sparse room types: fewer pieces is intentional and correct

  **Layout Plausibility Pre-Plan:**
  Before placing any furniture, make a compact placement plan in your private
  reasoning:
  - Identify doors, windows, open connections, and the most plausible anchor walls
    or focal zones for the room type.
  - Place primary anchor furniture first (beds, sofas, dining tables, desks,
    wardrobes), then place dependent furniture around it.
  - Keep dependent objects in their real functional relationship to the anchor:
    nightstands flank the bed near the head side, chairs face their table/desk,
    coffee tables sit in front of seating, and storage fronts remain accessible.
  - Avoid "technically possible but human-awkward" layouts. A collision-free,
    reachable room is not enough if the arrangement is not how people would
    reasonably live in or use the room.
  - Use snap_to_object_tool for relationships that should be physically adjacent
    when the tool supports it; do not rely on eyeballed coordinates for paired
    furniture such as nightstands beside a bed.
  - When the prompt requests multiple guest chairs against one side wall, keep them
    in one wall-parallel row with a shared yaw. Snap each to that wall using
    orientation="away", omit yaw from later position-only spacing moves, and verify
    each chair faces its desk/table with check_facing_tool before finishing.

  7. Generate all furniture assets (batch for style consistency)
  8. Place items using EXACT names returned from generate_assets
  9. Save object_ids from placement responses for future operations
  10. Adjust positions considering traffic flow and spatial relationships
  11. Complete TODOs systematically using designer_todo_manager
  12. Verify that you are satisfied with the design with observe_scene

  **CRITICAL - Collision-Free Completion:**
  Before finishing, you MUST call check_physics and verify zero collisions exist.
  You MUST NOT complete your work while ANY collisions remain. If collisions exist,
  preserve the reference layout as much as possible and resolve them with the
  smallest local position, yaw, or spacing change. Delete only optional,
  non-required decoration when local repair is impossible; never omit explicitly
  required furniture solely to resolve a collision.

  **CRITICAL - Layout Plausibility Completion:**
  Before finishing, call observe_scene and verify that the main furniture anchors
  and dependent object relationships look human-plausible. Do NOT complete with
  nightstands at the foot of a bed, chairs not facing their target, storage blocking
  daily use, or a primary furniture anchor that ignores obvious doors/windows when
  a better placement exists.
  Call check_facing_tool for every chair-target relation explicitly required by the
  prompt; visual inspection alone is not sufficient.

  ## Return Format:
  Provide a structured summary including:
  - Furniture items placed with their coordinates
  - Design rationale for your choices
  - How you used the visual information and coordinate markers
  - Why your design looks visually pleasing and creates a functional and livable space

  ## Scene Requirements:
  {{ scene_description }}

  ## Authoritative Room Boundary:
  All coordinates below are room-local XY coordinates in meters, with the origin at
  the room center.

  - Bounding-box length (X): {{ room_length }} m
  - Bounding-box width (Y): {{ room_width }} m
  - `room_local_footprint_vertices`: {{ room_local_footprint_vertices }}

  The ordered footprint vertices define the actual usable floor boundary and are
  authoritative for furniture placement. Length and width describe only its
  axis-aligned bounding box. Do not treat that bounding box as usable floor space.
  Every furniture footprint must remain inside the polygon. Concave cutouts are
  outside the room even when they lie within the bounding box.
