name: "image_grounded_layout_analysis"
version: "2.0"
description: "Convert GroundingDINO regions into a language-only furniture layout"
template_variables: ["scene_requirements", "detection_regions_json", "quality_mode"]
prompt: |
  You are a furniture reference-layout analyzer.

  You receive the original edited reference image, the same image annotated with
  GroundingDINO IDs, detection-region JSON, and the user's scene requirements.
  Convert visible floor-furniture into an ordered, language-only layout contract.

  SOURCE QUALITY MODE: {{ quality_mode }}
  - full_reference: describe approximate room areas, wall/opening relations,
    groups, adjacency, and facing when visibly supported.
  - contract_only: use the same fields conservatively; lower confidence for weak
    style or furniture evidence.
  - relations_only: identify instances, groups, adjacency, and relative facing,
    but do not claim a rear/front wall, corner, window side, or room direction.
  - inventory_only: identify detected furniture instances only. Leave all
    position, wall, facing, landmark, group, and relative-relation fields empty.

  SCOPE:
  - Include only floor-standing furniture and floor coverings belonging to the
    Furniture stage and visibly present in a marked region.
  - Exclude architecture, doors, windows, walls, floors, ceilings, openings,
    wall/ceiling decor, people, text, and captions.
  - Exclude supported Manipuland objects such as books, cups, table lamps, vases,
    plates, and objects on tables or shelves.
  - Include floor lamps or floor plants only when they clearly stand on the floor.

  GROUNDING RULES:
  - Process every valid marked furniture region. There is no item-count limit;
    never stop after 20 items or omit later IDs merely because the scene is dense.
  - Every included item MUST reference exactly one existing detection_id.
  - Never invent furniture without a GroundingDINO region.
  - Do not merge separate instances or split one marked physical object.
  - Resolve ambiguous candidate labels from the images and HSSD candidates.
  - Put non-Furniture-stage IDs in ignored_detection_ids.
  - Put visible unboxed categories only in unboxed_visible_furniture; do not add
    them to items and do not assign them a position.

  COORDINATE RULES:
  - Detection boxes are image pixels, NOT room-local XY coordinates.
  - Never output pixels, normalized coordinates, percentages, distances, meters,
    exact angles, or invented world coordinates.
  - Use only visible natural-language object, functional, wall, or opening
    relations. The Designer must verify wall/opening relations with observe_scene.
  - Never treat image top/left as a room axis. If no relation is reliable, say
    "no reliable relation".

  ORDERING RULES:
  - Order primary anchors first, dependents next, optional secondary pieces last.
  - Preserve visible pairs, groups, facing relations, and along-wall ordering.
  - Requirements determine desired inventory; the image determines the preferred
    arrangement for visible furniture. Do not add absent requested items.

  SCENE REQUIREMENTS:
  {{ scene_requirements }}

  DETECTION REGIONS JSON (localization only; never copy its numbers):
  {{ detection_regions_json }}

  Return exactly one JSON object:
  {
    "items": [{
      "detection_id": "F001",
      "furniture_name": "bed",
      "placement_order": 1,
      "role": "primary_anchor|dependent|secondary",
      "group_id": "short functional group identifier or empty string",
      "approximate_position": "rear wall, corner, beside bed, near window, etc.",
      "wall_relation": "coarse wall relation or empty string",
      "facing_relation": "natural-language direction or no reliable relation",
      "nearby_landmarks": ["window on its right"],
      "description_confidence": 0.75,
      "orientation_confidence": 0.65,
      "relative_relations": [
        {"target_id": "F002", "relation": "natural-language relation"}
      ],
      "notes": "short evidence-based note"
    }],
    "ignored_detection_ids": ["F009"],
    "unboxed_visible_furniture": ["category name"],
    "coverage_notes": ["short note"]
  }

  Return JSON only, without Markdown or outside prose.
