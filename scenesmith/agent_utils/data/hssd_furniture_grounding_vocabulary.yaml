review_notes:
  - >-
    Plumbing fixtures such as bathtub, bidet, shower stall, sink, toilet, urinal,
    and washbasin are omitted because they are fixed fixtures rather than movable
    Furniture-stage assets.
  - >-
    Mattress, headboard, bedclothes, blanket, quilt, and cushions are omitted as
    parts or supported accessories; GroundingDINO should detect the complete bed.
  - >-
    Generic labels are intentionally kept alongside HSSD subtypes, for example
    chair plus armchair/club chair/swivel chair. Region-level NMS and the VLM
    analyzer resolve duplicate boxes and final category names.
